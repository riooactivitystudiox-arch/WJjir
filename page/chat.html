<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Global Chat · WaliJomok</title><link rel="stylesheet" href="../style.css"><style>body{background:#000;color:#fff}.chat{height:calc(100vh - 150px);display:flex;flex-direction:column;padding:0 1rem}.messages{flex:1;overflow:auto;border:1px solid #202020;border-radius:16px;padding:12px;background:#070707}.msg{margin:8px 0}.meta{font-size:.7rem;color:#777;margin-bottom:3px}.bubble{display:inline-block;max-width:85%;padding:9px 12px;border-radius:13px;background:#111;border:1px solid #222;word-break:break-word}.mine .bubble{background:#eee;color:#000}.composer{display:flex;gap:8px;margin-top:10px}.composer input{flex:1;background:#0d0d0d;border:1px solid #222;color:#fff;border-radius:13px;padding:12px}.composer button{width:58px;border:0;border-radius:13px;background:#fff;color:#000;font-weight:800}.hint{font-size:.7rem;color:#666;padding:8px 0;text-align:center}</style></head><body><div class="container"><div class="header-nav"><span class="left-title">Global Chat</span><a href="../home.html" class="right-logo"><img src="../assets/logo-wj.png"></a></div><div class="chat"><div class="hint">Satu ruang chat untuk semua member · real-time</div><div id="messages" class="messages"></div><form id="form" class="composer"><input id="input" maxlength="1000" autocomplete="off" placeholder="Tulis pesan..."><button>Kirim</button></form></div></div><script src="../auth.js"></script><script src="/socket.io/socket.io.js"></script><script>const box=document.getElementById('messages');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function add(m){const mine=window.currentUser&&m.member_id===window.currentUser.id;const el=document.createElement('div');el.className='msg '+(mine?'mine':'');el.dataset.id=m.id;el.innerHTML=`<div class="meta">${esc(m.display_name)} · ${new Date(m.created_at).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}</div><div class="bubble">${esc(m.message)}</div>`;box.appendChild(el);box.scrollTop=box.scrollHeight}fetch('/api/messages').then(r=>r.json()).then(ms=>ms.forEach(add));const socket=io();socket.on('chat:message',add);socket.on('chat:deleted',x=>document.querySelector(`[data-id="${x.id}"]`)?.remove());document.getElementById('form').onsubmit=e=>{e.preventDefault();const v=input.value.trim();if(v){socket.emit('chat:send',v);input.value='';input.focus()}};</script></body></html>
