<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Posts · WaliJomok</title><link rel="stylesheet" href="../style.css"><style>.post{padding:0 1.15rem 1.5rem}.post-card{border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:14px;margin-bottom:12px;background:#080808}.top{display:flex;gap:10px;align-items:center}.avatar{width:38px;height:38px;border-radius:50%;overflow:hidden;background:#111}.avatar img{width:100%;height:100%;object-fit:cover}.meta{font-size:.7rem;color:#666}.body{color:#ccc;line-height:1.55;margin-top:12px;white-space:pre-wrap}.bodyimg{max-width:100%;border-radius:12px;margin-top:10px}.del{float:right;background:none;border:0;color:#777;cursor:pointer}</style></head><body><div class="container"><div class="header-nav"><span class="left-title">Posts</span><a href="../home.html" class="right-logo"><img src="../assets/logo-wj.png"></a></div><div id="posts" class="post"></div><div class="page-footer">WaliJomok · WJ · 2026</div></div><script src="../auth.js"></script><script>const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const r=await fetch('/api/posts');const ps=await r.json();posts.innerHTML=ps.map(p=>`<article class="post-card"><div class="top"><div class="avatar"><img src="${p.avatar||'../images/blank.png'}"></div><div><b>${esc(p.display_name)}</b><div class="meta">${esc(p.role)} · ${new Date(p.created_at).toLocaleString('id-ID')}</div></div>${window.currentUser?.role==='Admin'?`<button class="del" onclick="delPost(${p.id})">Hapus</button>`:''}</div><div class="body">${esc(p.content)}</div>${p.image_url?`<img class="bodyimg" src="${p.image_url}">`:''}</article>`).join('')||'<div style="color:#666">Belum ada post.</div>'}async function delPost(id){if(confirm('Hapus post ini?')){await fetch('/api/posts/'+id,{method:'DELETE'});load()}}setTimeout(load,900);</script></body></html>
