<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaliJomok · Home</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="home.css">
</head>
<body>

<!-- LOADING SCREEN -->
<div id="loadingScreen">
    <div class="loader-content">
        <img src="assets/logo-wj.png" alt="WJ" class="loader-logo">
        <div class="loader-bar">
            <div class="loader-progress"></div>
        </div>
        <p class="loader-text">WaliJomok</p>
    </div>
</div>

<!-- MAIN CONTENT -->
<div id="mainContent" class="device-frame" style="display:none;">
    
    <!-- HEADER -->
    <div class="header-top">
        <img src="assets/logo-wj.png" alt="WJ Logo">
        <div class="header-text">
            <h1>WaliJomok</h1>
            <span class="header-sub">Community</span>
        </div>
    </div>

    <!-- MENU LIST - Redesigned -->
    <div class="menu-list">
        
        <a href="page/community.html" class="menu-card card-1">
            <div class="card-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            </div>
            <div class="menu-content">
                <div class="text-wrapper">
                    <span class="menu-title">Member List</span>
                    <span class="menu-sub">11 members · Verified</span>
                </div>
                <span class="btn-box">Open</span>
            </div>
        </a>

        <a href="post/jawajir.html" class="menu-card card-2">
            <div class="card-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            </div>
            <div class="menu-content">
                <div class="text-wrapper">
                    <span class="menu-title">Posts</span>
                    <span class="menu-sub">Latest updates</span>
                </div>
                <span class="btn-box">View</span>
            </div>
        </a>

        <a href="page/memories.html" class="menu-card card-3">
            <div class="card-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
            </div>
            <div class="menu-content">
                <div class="text-wrapper">
                    <span class="menu-title">Memories</span>
                    <span class="menu-sub">Photo Gallery</span>
                </div>
                <span class="btn-box">Open</span>
            </div>
        </a>

        <a href="page/links.html" class="menu-card card-4">
            <div class="card-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
            </div>
            <div class="menu-content">
                <div class="text-wrapper">
                    <span class="menu-title">Links</span>
                    <span class="menu-sub">Discord · WhatsApp</span>
                </div>
                <span class="btn-box">Join</span>
            </div>
        </a>

    </div>

    <div class="footer">WaliJomok · WJ · 2026</div>
</div>

<script>
    // Loading screen
    window.addEventListener('load', () => {
        setTimeout(() => {
            const loader = document.getElementById('loadingScreen');
            const main = document.getElementById('mainContent');
            loader.classList.add('hide');
            setTimeout(() => {
                loader.style.display = 'none';
                main.style.display = 'block';
                main.classList.add('show');
            }, 500);
        }, 1800); // Loading duration ~1.8s
    });
</script>
</body>
</html>
