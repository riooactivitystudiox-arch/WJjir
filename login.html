<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login · WaliJomok</title>
  <link rel="stylesheet" href="home.css">
  <style>
    body {
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: Inter, system-ui, sans-serif;
      display: grid;
      place-items: center;
    }
    .login {
      width: min(92vw, 380px);
      padding: 28px;
      border: 1px solid #222;
      border-radius: 22px;
      background: #0a0a0a;
      box-shadow: 0 20px 70px #000;
    }
    .login img {
      width: 64px;
      height: 64px;
      object-fit: contain;
    }
    .login h1 {
      margin: 18px 0 6px;
    }
    .muted {
      color: #888;
      font-size: .85rem;
      margin-bottom: 22px;
    }
    label {
      display: block;
      font-size: .8rem;
      color: #aaa;
      margin: 14px 0 7px;
    }
    select, input, button {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #292929;
      background: #111;
      color: #fff;
      padding: 13px 14px;
      border-radius: 12px;
      font: inherit;
    }
    button {
      margin-top: 18px;
      background: #fff;
      color: #000;
      font-weight: 800;
      cursor: pointer;
    }
    .error {
      color: #ff7777;
      font-size: .85rem;
      min-height: 20px;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <main class="login">
    <img src="assets/logo-wj.png" alt="WJ">
    <h1>WaliJomok</h1>
    <div class="muted">Masuk sebagai member untuk membuka komunitas.</div>
    <form id="form">
      <label>Nama Member</label>
      <select id="username" required></select>
      <label>Password</label>
      <input id="password" type="password" placeholder="Password member" required autocomplete="current-password">
      <button type="submit">MASUK</button>
      <div id="error" class="error"></div>
    </form>
  </main>
  <script>
    const s = document.getElementById('username');
    fetch('/api/members-public')
      .then(r => r.json())
      .then(ms => {
        s.innerHTML = ms.map(m => `<option value="${m.username}">${m.display_name}</option>`).join('');
      })
      .catch(() => {
        document.getElementById('error').textContent = 'Gagal memuat daftar member.';
      });

    document.getElementById('form').onsubmit = async (e) => {
      e.preventDefault();
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: s.value,
          password: document.getElementById('password').value
        })
      });
      const d = await r.json();
      if (r.ok) location.href = '/home.html';
      else document.getElementById('error').textContent = d.error || 'Login gagal.';
    };
  </script>
</body>
</html>
